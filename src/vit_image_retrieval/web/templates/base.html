<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ViT Image Retrieval Web{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-image"></i> ViT Image Retrieval
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('feature_extraction') }}">
                            <i class="fas fa-cog"></i> Feature Extraction
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('image_retrieval') }}">
                            <i class="fas fa-search"></i> Image Retrieval
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- App Message Modal -->
    <div class="modal fade" id="appMessageModal" tabindex="-1" aria-labelledby="appMessageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="appMessageModalLabel"><i class="fas fa-info-circle"></i> Message</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="appMessageContent">
                    <!-- Message content will be inserted here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light text-center text-muted py-3 mt-5">
        <div class="container">
            <p>ViT Image Retrieval System - Powered by Vision Transformer and FAISS</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    // Global function to show app messages
    function showAppMessage(message, type = 'info') {
        const modal = $('#appMessageModal');
        const content = $('#appMessageContent');
        
        let icon = '<i class="fas fa-info-circle text-primary"></i> ';
        let title = 'Message';
        
        if (type === 'error') {
            icon = '<i class="fas fa-exclamation-circle text-danger"></i> ';
            title = 'Error';
        } else if (type === 'success') {
            icon = '<i class="fas fa-check-circle text-success"></i> ';
            title = 'Success';
        } else if (type === 'warning') {
            icon = '<i class="fas fa-exclamation-triangle text-warning"></i> ';
            title = 'Warning';
        }
        
        $('#appMessageModalLabel').html(icon + title);
        content.html('<p>' + message + '</p>');
        modal.modal('show');
    }

    // Global function to show confirm modal
    function showConfirmModal(title, message, callback) {
        // Create modal dynamically
        const modalId = 'confirmModal-' + Date.now();
        const modalHtml = `
            <div class="modal fade" id="${modalId}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">${title}</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <p>${message}</p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="button" class="btn btn-danger" id="${modalId}-confirm">Confirm</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        $('body').append(modalHtml);
        const modal = $('#' + modalId);
        modal.modal('show');
        
        $('#' + modalId + '-confirm').click(function() {
            modal.modal('hide');
            callback();
            // Remove modal after it's hidden
            modal.on('hidden.bs.modal', function() {
                modal.remove();
            });
        });
        
        // Remove modal if cancelled
        modal.on('hidden.bs.modal', function() {
            modal.remove();
        });
    }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
